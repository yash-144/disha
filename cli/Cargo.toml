[package]
name = "disha-cli"
version = "1.0.0"
edition = "2021"
authors = ["DISHA Engineering Team"]
description = "Operator command-line interface for DISHA Platform"

[[bin]]
name = "disha"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"

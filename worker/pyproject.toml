[project]
name = "disha-worker"
version = "1.0.0"
description = "Background task worker for DISHA Platform"
authors = [{ name = "DISHA Engineering Team" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

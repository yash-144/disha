[project]
name = "disha-api"
version = "1.0.0"
description = "FastAPI backend for DISHA Student Early-Warning & Intervention Platform"
authors = [{ name = "DISHA Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "passlib[bcrypt,argon2]>=1.7.4",
    "bcrypt>=4.0.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

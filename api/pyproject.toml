[project]
name = "disha-api"
version = "1.0.0"
description = "FastAPI backend for DISHA Student Early-Warning & Intervention Platform"
authors = [{ name = "DISHA Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
meko = ["disha-meko"]  # pip install -e ../meko
test = ["pytest", "aiosqlite", "alembic"]
# optional local IndicTrans2 translation (DISHA_TRANSLATE_ENABLED=true); CPU torch is enough
translate = ["torch", "transformers>=4.45,<5", "sentencepiece", "IndicTransToolkit"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
